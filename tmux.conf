bind-key C-b send-prefix
# bind-key C-b last-window
bind S new-session

# Open shell in a popup with Ctrl+b T
bind-key T display-popup -E

# Open htop in a popup with Ctrl+b H
bind-key H display-popup -E "htop"

# Make mouse useful in copy mode
setw -g mouse on

# Allow xterm titles in terminal window, terminal scrolling with scrollbar, and setting overrides of C-Up, C-Down, C-Left, C-Right
set -g set-titles on
set -g set-titles-string "#T"
set -ga terminal-overrides ",xterm*:XT:smcup@:rmcup@"
set -ga terminal-overrides ",tmux*:XT:smcup@:rmcup@"
set-option -gas terminal-overrides "*:Tc" # true color support
set-option -gas terminal-overrides "*:RGB" # true color support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colors - needs tmux-3.0

# Scroll History
set -g history-limit 30000

# Set ability to capture on start and restore on exit window data when running an application
setw -g alternate-screen on

# Lower escape timing from 500ms to 50ms for quicker response to scroll-buffer access.
set -s escape-time 50

set -g default-terminal "tmux-256color"

set-option -sa terminal-features ',tmux-256color:RGB'
set-option -ga terminal-overrides ',screen-256color:Tc'
set-option -ga terminal-overrides ',xterm-256color:Tc'
set-option -ga terminal-overrides ',tmux-256color:Tc'
set-option -g focus-events on

setw -g xterm-keys on

# bind "\"" split-window -v -c "#{pane_current_path}"
# bind "%" split-window -h -c "#{pane_current_path}"
# bind "c" new-window -c "#{pane_current_path}"

#is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
#    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
#bind -n Pageup if-shell "$is_vim" "send-keys Pageup" "copy-mode -u"
#bind -n S-Pageup if-shell "$is_vim" "send-keys Pageup" "copy-mode -u"
#bind -n S-Pagedown send-keys Pagedown
bind -n S-Pageup copy-mode -u
bind -n S-Pagedown send-keys Pagedown

set -g @continuum-restore 'on'
set -g pane-border-status top
set -g pane-border-format "#P: #{pane_current_command}"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'seebi/tmux-colors-solarized'
set -g @plugin 'MunifTanjim/tmux-suspend'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'MunifTanjim/tmux-mode-indicator'
set -g @treemux-tree-nvim-init-file '~/.tmux/plugins/treemux/configs/treemux_init.lua'
set -g @plugin 'kiyoon/treemux'
set -g status-right-length 120
set -g status-right '#(gitmux "#{pane_current_path}") %Y-%m-%d %H:%M #{tmux_mode_indicator}'
run '~/.tmux/plugins/tpm/tpm'
